[project]
name = "lobforge"
version = "0.1.0"
description = "Limit order book capture and microstructure research"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "aiohttp>=3.9"]
# The research tier. The collector deliberately does not depend on any of
# this: it has to keep running on a box where torch was never installed.
research = ["numpy>=1.26", "torch>=2.2", "matplotlib>=3.8"]

[project.scripts]
lobforge-capture = "lobforge.capture:main"
lobforge-sandbox = "lobforge.sandbox.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lobforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
